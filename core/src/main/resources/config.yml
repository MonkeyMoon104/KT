config-version: "${version}"

disabled-worlds: []

# When true: particles/sounds/displays only — no damage, blocks, potions, knockback, heals, combat spawns.
cosmetic-mode: false

# When false: kill effects only play on player kills (mob KillCoins rewards still use economy.yml).
effects-on-mobs: true

# Fallback language pack code (EN, IT, ES, ...) when player locale is unknown.
default-language: EN

worldguard:
  block-changes: RESPECT
  respect-build-flag: true
  bypass-permission: "ktplus.worldguard.bypass"

luckperms:
  grant-permission-on-purchase: true

particlePlus:
  turn-off-radius: 20
  turn-off-player-particles: true
  turn-off-mob-particles: true
  turn-off-block-particles: true
  turn-off-item-particles: true

schematics:
  default-fallback: STONE
  log-unresolved: true
